<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yifan AI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, Arial, sans-serif; }
    body { margin: 0; background: #0b1020; color: #eef2ff; min-height: 100vh; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 18px; }
    h1 { margin-bottom: 6px; letter-spacing: -.04em; }
    .muted { color: #a7b0cc; }
    #chat { display: flex; flex-direction: column; gap: 12px; margin: 28px 0; }
    .bubble { padding: 14px 16px; border-radius: 16px; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
    .user { background: #293b72; align-self: flex-end; max-width: 88%; }
    .assistant { background: #171f35; border: 1px solid #2b3550; align-self: stretch; }
    form { display: flex; gap: 10px; position: sticky; bottom: 12px; }
    textarea { flex: 1; resize: vertical; min-height: 54px; max-height: 180px; padding: 14px; border-radius: 14px; border: 1px solid #34415f; background: #111a2e; color: white; font: inherit; }
    button { border: 0; border-radius: 14px; padding: 0 20px; background: #8ba7ff; color: #10162a; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    footer { font-size: 12px; color: #8d98b8; margin-top: 14px; }
    @media (max-width: 520px) { form { flex-direction: column; } button { min-height: 48px; } }
  </style>
</head>
<body>
  <main>
    <h1>Yifan AI ✨</h1>
    <div class="muted">Your AI assistant, running on your own website.</div>
    <div id="chat" aria-live="polite">
      <div class="bubble assistant">Hi! I'm Yifan AI. What would you like help with?</div>
    </div>
    <form id="form">
      <textarea id="message" placeholder="Ask Yifan AI anything..." required maxlength="8000"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <footer>Your message is sent to the configured AI provider. Don't enter passwords or sensitive personal information.</footer>
  </main>
  <script>
    const form = document.querySelector("#form");
    const input = document.querySelector("#message");
    const send = document.querySelector("#send");
    const chat = document.querySelector("#chat");

    function addBubble(text, role) {
      const el = document.createElement("div");
      el.className = "bubble " + role;
      el.textContent = text;
      chat.appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;

      addBubble(message, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "Thinking…";
      const pending = addBubble("Thinking…", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed.");
        pending.textContent = data.reply;
      } catch (error) {
        pending.textContent = "Sorry — " + (error.message || "Something went wrong.");
      } finally {
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    });
  </script>
</body>
</html>
